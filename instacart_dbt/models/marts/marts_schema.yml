version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]

  - name: dim_customers
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: customer_tier
        tests:
          - accepted_values:
              values: ['champion', 'loyal', 'regular', 'occasional', 'new']

  - name: fct_product_performance
    columns:
      - name: product_id
        tests: [unique, not_null]